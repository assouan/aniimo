# Generic safe-by-default profile. A filename is only a discovery hint; it does
# not prove ownership and cannot by itself authorize decompilation.
schema_version: 3
workflow:
  default_command: update
  mode: complete_incremental
  preflight:
    enabled: true
    quick_checks_every_run:
      - configuration
      - required_mounts
      - permissions
      - free_space
      - input_snapshot_boundary
    cached_doctor_checks:
      enabled: true
      cache_key_inputs:
        - image_digests
        - tools_lock_digest
        - profile_digest
      checks:
        - tool_presence
        - pinned_version_match
        - adapter_load
    full_doctor_command: explicit_force_refresh
  planning:
    capture_plan: enabled
    analysis_plan: enabled
    reuse_plan_in_same_run: true
    dry_run_behavior: stop_after_plan_before_write
  execute_only_invalidated_work: true

game:
  id: target-game
  live_source_root: /source/game
  snapshot_root: /inputs
  distribution_manifest: null
  backend: auto
  platform: auto
  architecture: auto
  unity_version: auto

capture:
  require_completed_installation: true
  immutable_snapshot: true
  object_root: /inputs/objects/sha256
  snapshot_root: /inputs/snapshots
  current_pointer: /inputs/current.json
  hash_algorithm: sha256
  trust_mtime_cache: false
  reject_inputs_changed_during_capture: true
  stable_read_passes: 1
  pre_and_post_read_stat: true
  changed_during_read: retry_once_then_fail
  decompress_during_capture: false
  follow_symlinks: false
  preserve_absolute_host_paths: false

handoff:
  root: /handoff
  slot_environment_variable: MODKIT_HANDOFF_SLOT
  pending_record: /handoff/pending/<slot>.json
  payload_fields: [schema_version, workflow_run_id, snapshot_id, snapshot_manifest_sha256]
  publish_after_snapshot: true
  atomic_publish_and_claim: true
  reject_occupied_slot: true
  require_exact_snapshot_manifest_match: true
  current_pointer_usage: manual_commands_only

manifests:
  input_selection: /config/input-selection.yaml
  decompilation_policy: /config/decompilation.yaml

analysis:
  ghidra: enabled
  ghidra_discovery_scope: relevant_native_modules
  metadata_scope: all_relevant_metadata
  native_decompile_scope: approved_game_and_integration
  include_engine_implementations: false
  include_third_party_implementations: false
  native_export_granularity: body
  managed_export_granularity: type
  primary_decompile_timeout_seconds: 15
  max_primary_timeouts_per_run: 16
  module_workers: 1
  preserve_raw_evidence: true
  fuzzy_matching: review_only
  bsim: enabled
  bsim_index_scope: approved_game_and_integration_bodies
  bsim_query_scope: unresolved_or_non_exact_candidates
  skip_bsim_query_for_exact_identity: true
  execute_enabled_stages_only_when_invalidated: true
  reuse_complete_cache_hits: true
  metadata_failure_states:
    - unsupported_metadata_version
    - inconsistent_metadata
    - parse_error
    - suspected_protection
  suspected_protection_requires_evidence: true
  native_outputs:
    disassembly_before_decompilation: true
    asm_required_when_instructions_available: true
    body_output_states: [c_and_asm, asm_only, disassembly_failed, pending]
    reject_empty_truncated_or_error_c: true
    preserve_decompiler_warnings: true
    continue_after_body_failure: true
  failure_cache:
    enabled: true
    reuse_unchanged_failure: true
    result_when_asm_exists: asm_only
    key_inputs:
      - body_bytes_and_range
      - tool_version_and_digest
      - decompiler_options
      - architecture_and_abi
      - applied_types_and_layouts
      - managed_signature
      - native_prototype
      - reference_context
      - budget_class
    retry_triggers:
      - body_or_range_changed
      - tool_or_options_changed
      - types_layout_or_signature_changed
      - native_prototype_changed
      - relevant_reference_context_changed
      - budget_class_changed
      - explicit_targeted_retry
  difficult_queue:
    enabled: true
    automatic_after_primary_failure: true
    timeout_seconds: 120
    max_bodies_per_run: 2
    max_wall_time_seconds: 240
    explicit_retry_command: retry-difficult
  coverage:
    enabled: true
    reconcile_approved_native_bodies: true
    mutually_exclusive_body_states: true
    include_expected_methods_without_body: true
    include_unresolved_call_targets: true
    include_unconfirmed_function_candidates: true
    include_unattributed_executable_ranges: true

lua:
  enabled: auto
  dialect: auto
  bridge: auto
  parse_sources: true
  inspect_bindings: true
  execute_extracted_code: false
  runtime_probe: separate_authorized_process
  require_matching_build_for_observations: true
  infer_absence_as_removal: false

outputs:
  root: /output
  csv: true
  normalized_json: true
  pseudocode: approved_game_bodies
  assembly_listing: approved_game_bodies
  native_body_manifest: native/bodies/<native_body_id>.json
  readable_native_views: required
  managed_view_root: native/index/by-managed-type
  module_view_root: native/index/by-module
  stable_unnamed_view_root: native/index/unnamed
  readable_view_links: [c, asm, managed_signature, native_prototype, references, diagnostics]
  coverage_json: coverage.json
  native_bodies_csv: native_bodies.csv
  native_prototypes_csv: native_prototypes.csv
  lua_definitions: true
  documentation: true
  overwrite_only_if_content_changed: true
  include_absolute_host_paths: false

state:
  root: /state
  artifact_root: /artifacts
  ghidra_root: /ghidra-state
  cache_root: /cache
  work_root: /work
  single_writer: true
  atomic_publication: true

reporting:
  enabled: true
  capture_fragment_root: /inputs/run-reports
  final_report_root: /output/reports
  formats: [json, markdown, csv]
  timing:
    enabled: true
    granularity: stage_and_substep
    duration_clock: monotonic
    record_cache_status: true
    record_skipped_steps: true
    record_item_and_byte_counts: true
    record_cpu_time_when_available: true
    record_peak_rss_when_available: true
  publish_latest_pointer: true
  atomic_publication: true

compatibility:
  approval_basis: exact_capability_dependencies
  unchanged_dependency_transfer: explicit_policy_only
  unknown_dependency: disable_affected_capability

runtime_policy:
  unknown_build: evaluate_each_capability
  ambiguous_resolution: disable_affected_capability
  automatic_hook_approval: false
  external_authorization_required_for_distribution: true
